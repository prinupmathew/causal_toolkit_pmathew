[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal_toolkit_pmathew"
version = "0.1.0"
description = "A Python package for causal inference methods including ATE estimation, propensity score methods, and meta-learners."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Prinu Mathew", email = "prinupmathew@uchicago.edu"}
]
keywords = ["causal inference", "statistics", "machine learning", "treatment effects"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "lightgbm>=4.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "patsy>=0.5",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "pylint>=2.12.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/prinupmathew/causal_toolkit_pmathew"
Documentation = "https://github.com/prinupmathew/causal_toolkit_pmathew#readme"
Repository = "https://github.com/prinupmathew/causal_toolkit_pmathew"
"Bug Tracker" = "https://github.com/prinupmathew/causal_toolkit_pmathew/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "pylint>=2.12.0",
    "mypy>=0.950",
]

[tool.setuptools.packages.find]
include = ["causal_toolkit_pmathew*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=causal_toolkit_pmathew --cov-report=html --cov-report=term"

[tool.black]
line-length = 88
target-version = ["py310", "py311"]
include = '\\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
